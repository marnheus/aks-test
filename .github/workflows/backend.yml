name: Deploy Backend Infrastructure (Bicep)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Deployment action'
        required: true
        type: choice
        options:
          - deploy
          - what-if
        default: 'what-if'

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-aks-backend-westeurope
  LOCATION: westeurope

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Create Resource Group
        run: |
          az group create \
            --name ${{ env.RESOURCE_GROUP }} \
            --location ${{ env.LOCATION }} \
            --tags project=aks-demo environment=shared managedBy=bicep

      - name: What-If Analysis
        if: inputs.action == 'what-if'
        run: |
          az deployment group what-if \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file backend/main.bicep \
            --parameters backend/main.bicepparam \
            --parameters githubRunnerToken='${{ secrets.RUNNER_TOKEN }}'

      - name: Deploy Backend
        if: inputs.action == 'deploy'
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file backend/main.bicep \
            --parameters backend/main.bicepparam \
            --parameters githubRunnerToken='${{ secrets.RUNNER_TOKEN }}' \
            --name backend-$(date +%Y%m%d%H%M%S)

      - name: Show Outputs
        if: inputs.action == 'deploy'
        run: |
          az deployment group show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name $(az deployment group list --resource-group ${{ env.RESOURCE_GROUP }} --query '[0].name' -o tsv) \
            --query properties.outputs
